name: CI Quality Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        # The committed lockfile is generated on macOS and omits install
        # records for rollup's Linux native binaries (notably
        # @rollup/rollup-linux-x64-gnu). Both npm ci and npm install
        # honor the lockfile and skip these optional deps on the Linux
        # runner, breaking vite build. Workaround per npm/cli#4828:
        # drop the lockfile + node_modules and let npm install resolve
        # optionals fresh for ubuntu-latest.
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Write dummy .env for tests
        # getSupabaseConfig() throws if VITE_SUPABASE_URL / _ANON_KEY are
        # missing, which crashes the app at first fetch and blocks the
        # Playwright dev server from rendering the empty state. The real
        # Supabase URL never gets hit because tests intercept
        # **/rest/v1/resources** with mockResourceApi — dummy values are
        # enough to satisfy the runtime check.
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=https://ci-dummy.supabase.co
          VITE_SUPABASE_ANON_KEY=ci-dummy-anon-key
          EOF

      - name: Build Application
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          # Use CI environment variables if needed
          CI: true

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
