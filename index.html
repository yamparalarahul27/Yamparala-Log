
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/png" href="/images/app-logo.png" />
      <title>Rahul's Log</title>
      <meta property="og:title" content="Rahul's Log" />
      <meta property="og:description" content="Save every useful link in one place." />
      <meta property="og:image" content="/images/og-image.png" />
      <meta property="og:type" content="website" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Rahul's Log" />
      <meta name="twitter:description" content="Save every useful link in one place." />
      <meta name="twitter:image" content="/images/og-image.png" />
      <script>
        (function () {
          try {
            var stored = localStorage.getItem("theme");
            var dark = stored
              ? stored === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (dark) document.documentElement.classList.add("dark");
          } catch (e) {}
        })();
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
